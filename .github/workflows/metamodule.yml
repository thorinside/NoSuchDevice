name: MetaModule plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin (with corrupter-dsp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout MetaModule plugin SDK
        uses: actions/checkout@v4
        with:
          repository: 4ms/metamodule-plugin-sdk
          ref: api-v2.3.0
          submodules: recursive
          path: metamodule-plugin-sdk

      - name: Install ARM toolchain (cached by the action)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '12.3.Rel1'

      - name: Check build tools (preinstalled on ubuntu runners)
        run: |
          # Avoid apt-get update: third-party mirrors on the runner image
          # occasionally fail with hash mismatches. Only install if missing.
          command -v ninja >/dev/null || (sudo apt-get update && sudo apt-get install -y ninja-build)
          cmake --version && ninja --version && python3 --version

      - name: Build .mmplugin
        run: |
          cmake -S metamodule -B metamodule/build -G Ninja \
            -DMETAMODULE_SDK_DIR=${GITHUB_WORKSPACE}/metamodule-plugin-sdk \
            -DINSTALL_DIR=${GITHUB_WORKSPACE}/metamodule/dist
          cmake --build metamodule/build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoSuchDevice-mmplugin
          path: metamodule/dist/NoSuchDevice-v*.mmplugin

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: metamodule/dist/NoSuchDevice-v*.mmplugin
